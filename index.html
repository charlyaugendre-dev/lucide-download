<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0F" />
  <title>Télécharger Lucide</title>
  <style>
    /* ==========================================================
       Jetons de couleur repris à l'identique de App.js (l. 33-50)
       ========================================================== */
    :root {
      --accent:        #8B00FF;
      --accent-soft:   #8B00FF15;
      --accent-light:  #9B30FF;
      --accent-dark:   #6600CC;
      --accent-muted:  #3D0080;
      --accent-glow:   #8B00FF40;
      --bg:            #0A0A0F;
      --bg-card:       #111118;
      --bg-card2:      #16161E;
      --border:        #1E1E2A;
      --text:          #FFFFFF;
      --text-secondary:#888899;
      --text-muted:    #3A3A4A;
      --divider:       #161616;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      /* San Francisco, comme l'app (aucune police custom chargée) */
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Gouttière de 24, identique à setupScroll */
      padding: calc(env(safe-area-inset-top) + 32px) 24px calc(env(safe-area-inset-bottom) + 40px);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Masqué par défaut : hors TikTok le script redirige avant
       tout affichage, donc rien ne flashe à l'écran. */
    #instructions {
      display: none;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    /* ---------- En-tête de marque (repris de AuthScreen) ---------- */
    .brand { margin-bottom: 32px; }

    .mark {
      width: 168px; height: 168px;
      margin: 0 auto;
      display: block;
      opacity: 0;
      transform: scale(.85);
      animation: markIn .45s cubic-bezier(.17,.89,.32,1.28) forwards;
    }
    @keyframes markIn {
      to { opacity: 1; transform: scale(1); }
    }



    /* ---------- Titres (setupEyebrow / setupTitle / setupSubtitle) ---------- */
    .eyebrow {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-light);
      margin-bottom: 14px;
    }
    h1 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 40px;
      margin-bottom: 14px;
      color: var(--text);
    }
    p.sub {
      font-size: 14px;
      line-height: 22px;
      letter-spacing: .1px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    /* ---------- Carte des étapes (fieldsCard) ---------- */
    .steps {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 8px 24px;
      text-align: left;
    }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 18px 0;
      border-bottom: 1px solid var(--divider);
    }
    .step:last-child { border-bottom: none; }

    .num {
      flex: none;
      width: 26px; height: 26px;
      border-radius: 13px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(139, 0, 255, .3);
    }
    .step-text {
      font-size: 17px;
      font-weight: 500;
      line-height: 24px;
      color: #bbb;
      padding-top: 1px;
    }
    .step-text strong { color: var(--text); font-weight: 700; letter-spacing: -.2px; }
    .dots { color: var(--accent-light); font-weight: 700; letter-spacing: 2px; }


    /* ---------- Repère vers les trois points de TikTok ---------- */
    #pointer {
      display: none;
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      right: 16px;
      z-index: 2;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: fadeIn .4s .45s forwards;
    }
    #pointer .label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-light);
      white-space: nowrap;
    }
    #pointer .arrow {
      font-size: 26px;
      line-height: 1;
      color: var(--accent-light);
      animation: nudge 1.4s ease-in-out infinite;
    }
    @keyframes nudge {
      0%, 100% { transform: translateY(0); opacity: 1; }
      50%      { transform: translateY(-6px); opacity: .55; }
    }
    @keyframes fadeIn { to { opacity: 1; } }


    /* ---------- Écrans courts ---------- */
    @media (max-height: 680px) {
      body { padding-top: calc(env(safe-area-inset-top) + 24px); }
      .mark { width: 128px; height: 128px; }
      .brand { margin-bottom: 28px; }
      h1 { font-size: 28px; line-height: 34px; }
      .step { padding: 14px 0; }
    }
  </style>
</head>
<body>

  <!-- Repère vers les trois points, en haut à droite de l'écran TikTok -->
  <div id="pointer">
    <span class="label">c'est ici</span>
    <div class="arrow">↑</div>
  </div>

  <div id="instructions">

    <div class="brand">
      <img class="mark" src="icone_lucide_transparent.png" alt="Lucide" />
    </div>

    <div class="eyebrow">Dernière étape</div>
    <h1>Ouvre la page<br />dans ton navigateur</h1>
    <p class="sub">TikTok bloque l'accès direct à l'App Store. Trois secondes et c'est réglé.</p>

    <div class="steps">
      <div class="step">
        <div class="num">1</div>
        <div class="step-text">Appuie sur les trois points <span class="dots">•••</span> en haut à droite.</div>
      </div>
      <div class="step">
        <div class="num">2</div>
        <div class="step-text">Choisis <strong>Ouvrir dans le navigateur</strong>.</div>
      </div>
      <div class="step">
        <div class="num">3</div>
        <div class="step-text">L'App Store s'ouvre tout seul.</div>
      </div>
    </div>
  </div>


  <noscript>
    <a href="https://apps.apple.com/app/id6773450265" style="color:#9B30FF;font-size:16px">
      Télécharger Lucide sur l'App Store
    </a>
  </noscript>

  <script>
    // ============ CONFIG ============
    // L'URL de ta fiche App Store. Seul champ à modifier si besoin.
    var APP_STORE_URL = "https://apps.apple.com/app/id6773450265";

    // ============ DÉTECTION DU NAVIGATEUR TIKTOK ============
    // TikTok ouvre les liens dans son navigateur interne, qui s'identifie
    // via ces marqueurs dans le "user agent". Si TikTok change un jour sa
    // signature et que la détection ne marche plus, c'est CETTE ligne
    // qu'il faut ajuster (ajouter le nouveau marqueur à la liste).
    var ua = navigator.userAgent || "";
    var isTikTok = /musical_ly|bytedance|tiktok|aweme|trill/i.test(ua);

    if (isTikTok) {
      // Ouvert DEPUIS TikTok : on n'essaie pas d'ouvrir l'App Store
      // (ce serait une page blanche). On affiche les instructions
      // et le repère vers les trois points.
      document.getElementById("instructions").style.display = "block";
      document.getElementById("pointer").style.display = "flex";
    } else {
      // Ouvert AILLEURS (Safari, Instagram, Chrome...) : redirection directe.
      window.location.replace(APP_STORE_URL);
    }
  </script>
</body>
</html>
